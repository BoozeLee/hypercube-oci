[project]
name = "hypercube"
version = "0.1.0"
description = "Small, secure, reproducible host for AI agents on OCI Arm."
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hypercube project" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "agentmail>=0.1.0",
    "fastapi>=0.115.0",
    "hypothesis>=6.131.0",
    "oci>=2.148.0",
    "pydantic-settings>=2.8.0",
    "svix>=1.62.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mutmut>=3.2.0",
    "pre-commit>=4.1.0",
    "pyright>=1.1.396",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "schemathesis>=4.0.0",
]

[project.scripts]
hypercube = "hypercube.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypercube"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/hypercube"]
tests_dir = ["tests"]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check
        language: system
        files: \.tf$
        pass_filenames: false
      - id: terraform-validate
        name: terraform validate
        entry: terraform validate
        language: system
        files: \.tf$
        pass_filenames: false
